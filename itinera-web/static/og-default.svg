<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Fondo: Deep Warm Black (TEREN Dark Mode Base) -->
  <rect width="1200" height="630" fill="#1C1917"/>
  
  <!-- Acentos geométricos sutiles -->
  <circle cx="1050" cy="80" r="350" fill="#FF8C42" opacity="0.08"/>
  <circle cx="150" cy="550" r="250" fill="#FF8C42" opacity="0.05"/>

  <!-- Marca Principal -->
  <text x="100" y="260" text-anchor="start" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="800" fill="#F5F4F1" letter-spacing="-2">
    Itinera
  </text>

  <!-- Tagline -->
  <text x="100" y="340" text-anchor="start" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="500" fill="#FF8C42" letter-spacing="0.5">
    Plan your journeys without friction.
  </text>

  <!-- Pills de características (Dark Primary Subtle) -->
  <g transform="translate(100, 430)">
    <rect x="0" y="0" width="220" height="48" rx="24" fill="#2C1F10" stroke="#FF8C42" stroke-width="1.5"/>
    <text x="24" y="29" text-anchor="start" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#FF8C42">Offline-ready</text>

    <rect x="240" y="0" width="260" height="48" rx="24" fill="#2C1F10" stroke="#FF8C42" stroke-width="1.5"/>
    <text x="264" y="29" text-anchor="start" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#FF8C42">Multi-currency</text>

    <rect x="520" y="0" width="200" height="48" rx="24" fill="#2C1F10" stroke="#FF8C42" stroke-width="1.5"/>
    <text x="544" y="29" text-anchor="start" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#FF8C42">Japan Edge</text>
  </g>

  <!-- Footer / Dominio -->
  <text x="100" y="560" text-anchor="start" font-family="'Inter', sans-serif" font-size="18" font-weight="500" fill="#57534E" letter-spacing="1">
    goitinera.app
  </text>
</svg>