<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!--
    ========================================================================
    TOKYO STATION SCHEMATIC MAP
    Refined minimalist 2D transit map design
    Philosophy: Clean, flat UI, high-contrast, optimized for mobile reading
    ========================================================================
  -->
  <defs>
    <!-- Crisp drop shadow for UI elements -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1c1917" flood-opacity="0.12" />
    </filter>

    <!-- Gradient for long-distance corridor -->
    <linearGradient id="long-walk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E60012" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f5ebd6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E60012" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Layer 1: Background -->
  <g id="background">
    <rect width="800" height="600" fill="#fcfbfa" />
  </g>

  <!-- Layer 2: Connecting Corridors (soft beige geometric tunnels) -->
  <g id="connecting-paths">
    <!-- Central North-South Corridor -->
    <rect x="250" y="160" width="140" height="280" rx="10" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.95" />

    <!-- Main East-West Transfer Hall -->
    <rect x="140" y="270" width="380" height="60" rx="10" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.95" />

    <!-- North Transfer Passage -->
    <line x1="250" y1="180" x2="520" y2="180" stroke="#e8dcc0" stroke-width="16" stroke-linecap="round" opacity="0.8" />

    <!-- South Transfer Passage -->
    <line x1="250" y1="420" x2="520" y2="420" stroke="#e8dcc0" stroke-width="16" stroke-linecap="round" opacity="0.8" />

    <!-- Keiyo Line Long Corridor (dashed 12-min walk) -->
    <path d="M 320 440 L 320 540 Q 320 550, 330 550 L 520 550"
          fill="none" stroke="url(#long-walk-grad)" stroke-width="10" stroke-dasharray="8,5" stroke-linecap="round" />
  </g>

  <!-- Layer 3: Platform Lines -->
  <!-- JR Yamanote Line (Green) - Modern pill-shaped platforms -->
  <g id="line-yamanote">
    <!-- Platform pill shape -->
    <rect x="355" y="200" width="30" height="200" rx="15" fill="#9ACD32" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />

    <!-- Track lanes (parallel lines) -->
    <line x1="345" y1="160" x2="345" y2="440" stroke="#9ACD32" stroke-width="3.5" opacity="0.5" stroke-linecap="round" />
    <line x1="395" y1="160" x2="395" y2="440" stroke="#9ACD32" stroke-width="3.5" opacity="0.5" stroke-linecap="round" />

    <!-- Platform labels -->
    <text x="370" y="190" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">P4/5</text>
    <text x="370" y="415" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">YAMANOTE</text>
  </g>

  <!-- Tokaido Shinkansen (Blue) - Clean parallel track design -->
  <g id="line-shinkansen">
    <!-- Platform pill shape -->
    <rect x="440" y="160" width="40" height="280" rx="20" fill="#0055A5" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />

    <!-- Track lanes (parallel lines for high-speed rail) -->
    <line x1="428" y1="130" x2="428" y2="470" stroke="#0055A5" stroke-width="3.5" opacity="0.45" stroke-linecap="round" />
    <line x1="492" y1="130" x2="492" y2="470" stroke="#0055A5" stroke-width="3.5" opacity="0.45" stroke-linecap="round" />

    <!-- Platform labels -->
    <text x="460" y="175" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">P14-19</text>
    <text x="460" y="420" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SHINKANSEN</text>
  </g>

  <!-- Keiyo Line Platform (Red) - Far South -->
  <g id="line-keiyo">
    <rect x="530" y="534" width="180" height="32" rx="16" fill="#E60012" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
    <text x="620" y="555" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">KEIYO LINE (B4F)</text>
  </g>

  <!-- Layer 4: Exit Badges (crisp flat circle pins) -->
  <g id="exits">
    <!-- Marunouchi West Exit -->
    <g id="exit-marunouchi" filter="url(#shadow)">
      <circle cx="100" cy="300" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="100" y="307" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">W</text>
    </g>

    <!-- Yaesu East Exit -->
    <g id="exit-yaesu" filter="url(#shadow)">
      <circle cx="540" cy="300" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="540" y="307" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
    </g>
  </g>

  <!-- Layer 5: Typography & Labels (pixel-perfect alignment) -->
  <g id="labels" font-family="Inter, system-ui, -apple-system, sans-serif">
    <!-- Title -->
    <text x="40" y="48" font-size="22" font-weight="800" fill="#1c1917" letter-spacing="-0.5">Tokyo Station</text>
    <text x="40" y="68" font-size="11" font-weight="600" fill="#78716c" letter-spacing="1.2" opacity="0.85">SCHEMATIC MAP • B1F / 1F</text>

    <!-- Side Labels -->
    <text x="70" y="300" font-size="11" font-weight="700" fill="#78716c" transform="rotate(-90 70 300)" text-anchor="middle" letter-spacing="1">MARUNOUCHI</text>
    <text x="570" y="300" font-size="11" font-weight="700" fill="#78716c" transform="rotate(90 570 300)" text-anchor="middle" letter-spacing="1">YAESU</text>

    <!-- Central Passage Label -->
    <text x="320" y="304" font-size="10" font-weight="600" fill="#78716c" text-anchor="middle" opacity="0.8">Central Passage</text>

    <!-- Warning Card for Keiyo Line -->
    <g id="transfer-warning">
      <rect x="250" y="478" width="200" height="36" rx="8" fill="#FEE2E2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)" />
      <text x="262" y="497" font-size="10" font-weight="700" fill="#991B1B">⚠ KEIYO LINE</text>
      <text x="262" y="508" font-size="9" font-weight="600" fill="#DC2626">12-minute walk</text>
    </g>
  </g>

  <!-- Layer 6: Legend (mathematically aligned) -->
  <g id="legend" font-family="Inter, system-ui, -apple-system, sans-serif">
    <!-- Legend Title -->
    <text x="40" y="540" font-size="11" font-weight="700" fill="#1c1917" letter-spacing="0.8">LEGEND</text>

    <!-- Legend Item 1: Yamanote Line -->
    <circle cx="48" cy="558" r="6" fill="#9ACD32" />
    <text x="62" y="561" font-size="10" font-weight="600" fill="#1c1917">Yamanote Line (JR East)</text>

    <!-- Legend Item 2: Shinkansen -->
    <circle cx="230" cy="558" r="6" fill="#0055A5" />
    <text x="244" y="561" font-size="10" font-weight="600" fill="#1c1917">Shinkansen (JR Central)</text>

    <!-- Legend Item 3: Keiyo Line -->
    <circle cx="420" cy="558" r="6" fill="#E60012" />
    <text x="434" y="561" font-size="10" font-weight="600" fill="#1c1917">Keiyo Line</text>

    <!-- Legend Item 4: Corridor -->
    <circle cx="48" cy="578" r="6" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="1.5" />
    <text x="62" y="581" font-size="10" font-weight="600" fill="#1c1917">Connecting Corridor</text>

    <!-- Legend Item 5: Exits -->
    <circle cx="230" cy="578" r="6" fill="#e25c3d" />
    <text x="244" y="581" font-size="10" font-weight="600" fill="#1c1917">Main Exit Points</text>
  </g>
</svg>
