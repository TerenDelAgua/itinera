<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!--
    ========================================================================
    SAPPORO STATION SCHEMATIC MAP
    Minimalist 2D transit map design
    Philosophy: Clean, flat UI, high-contrast, optimized for mobile reading
    ========================================================================
  -->
  <defs>
    <!-- Crisp drop shadow for UI elements -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1c1917" flood-opacity="0.12" filter-units="userSpaceOnUse" />
    </filter>

    <!-- Gradient for Chi-Ka-Ho Underground Walkway heading south -->
    <linearGradient id="chikaho-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5ebd6" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f5ebd6" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Layer 1: Background (transparent for dark/light mode compatibility) -->
  <g id="background">
    <rect width="800" height="600" fill="transparent" />
  </g>

  <!-- Layer 2: Connecting Corridors & The Underground Pedestrian Network -->
  <g id="connecting-paths">
    <!-- Main 1F Station Concourse (East-West Passage) -->
    <rect x="180" y="160" width="380" height="110" rx="10" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.95" />

    <!-- Chi-Ka-Ho (地下歩行空間 B1F - Massive underground walkway going South) -->
    <rect x="290" y="360" width="160" height="120" rx="8" fill="url(#chikaho-grad)" stroke="#e8dcc0" stroke-width="2" />
    <line x1="370" y1="360" x2="370" y2="470" stroke="#a8a29e" stroke-width="3" stroke-dasharray="5,4" stroke-linecap="round" />
  </g>

  <!-- Layer 3: Operator Zones & Platforms -->
  <!-- 1. JR Hokkaido Conventional Lines (Ground 1F - Hakodate Main Line) -->
  <!-- Platforms 1-4 (Otaru / Teine Directions) -->
  <g id="line-jr-platforms-1-4">
    <rect x="210" y="180" width="320" height="26" rx="13" fill="#00A0E9" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="370" y="196" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">JR HAKODATE MAIN LINE (P1-4)</text>
  </g>

  <!-- Platforms 5-10 (New Chitose Airport / Asahikawa Directions) -->
  <g id="line-jr-platforms-5-10">
    <rect x="210" y="214" width="320" height="26" rx="13" fill="#00A0E9" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="370" y="230" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">RAPID AIRPORT / ASAHIKAWA (P5-10)</text>
  </g>

  <!-- 2. Sapporo Municipal Subway (Underground B2F) -->
  <!-- Namboku Subway Line (Green - B2F Platform) - WEST SIDE -->
  <g id="line-namboku">
    <rect x="250" y="310" width="24" height="150" rx="12" fill="#009944" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="262" y="385" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" transform="rotate(-90 262 385)">NAMBOKU LINE (B2F)</text>
  </g>

  <!-- Toho Subway Line (Blue - B2F Platform) - EAST SIDE -->
  <g id="line-toho">
    <rect x="460" y="310" width="24" height="150" rx="12" fill="#0072BC" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="472" y="385" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" transform="rotate(-90 472 385)">TOHO LINE (B2F)</text>
  </g>

  <!-- Layer 4: Exit Pins -->
  <g id="exits">
    <!-- North Exit (Kita-guchi - Near Hokkaido University) -->
    <g id="exit-north" filter="url(#shadow)">
      <circle cx="370" cy="120" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="370" y="127" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">N</text>
    </g>

    <!-- South Exit (Minami-guchi - Near JR Tower / Daimaru) -->
    <g id="exit-south" filter="url(#shadow)">
      <circle cx="370" cy="310" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="370" y="317" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">S</text>
    </g>
  </g>

  <!-- Layer 5: Labels & Warnings -->
  <g id="labels" font-family="Inter, system-ui, -apple-system, sans-serif">
    <!-- Title -->
    <text x="40" y="48" font-size="22" font-weight="800" fill="currentColor" letter-spacing="-0.5">Sapporo Station</text>
    <text x="40" y="68" font-size="11" font-weight="600" fill="currentColor" opacity="0.6" letter-spacing="1.2">SCHEMATIC MAP • B2F TO 1F</text>

    <!-- Orientations / Exit Labels (Symmetrically aligned above exit pins) -->
    <text x="370" y="80" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">NORTH EXIT (HOKKAIDO UNIVERSITY)</text>
    <text x="370" y="275" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">SOUTH EXIT (JR TOWER / STELLAR PLACE)</text>

    <!-- Chi-Ka-Ho Direction Label -->
    <text x="370" y="450" font-size="8" font-weight="800" fill="currentColor" opacity="0.5" text-anchor="middle">↓ CHI-KA-HO UNDERGROUND WALKWAY</text>
    <text x="370" y="462" font-size="7" font-weight="700" fill="currentColor" opacity="0.5" text-anchor="middle">(TO ODORI PARK &amp; SUSUKINO - SNOW-FREE)</text>

    <!-- Airport Access Card -->
    <g id="airport-card">
      <rect x="520" y="414" width="230" height="46" rx="8" fill="#EFF6FF" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)" />
      <text x="532" y="432" font-size="9" font-weight="700" fill="#1E40AF">✈ NEW CHITOSE AIRPORT</text>
      <text x="532" y="443" font-size="8" font-weight="600" fill="#2563EB">JR Rapid Airport service runs every</text>
      <text x="532" y="452" font-size="8" font-weight="600" fill="#2563EB">12 min (37 min journey) from P5-6.</text>
    </g>
  </g>

  <!-- Layer 6: Legend -->
  <g id="legend" font-family="Inter, system-ui, -apple-system, sans-serif">
    <text x="40" y="540" font-size="11" font-weight="700" fill="currentColor" letter-spacing="0.8">LEGEND</text>

    <circle cx="48" cy="558" r="6" fill="#00A0E9" />
    <text x="62" y="561" font-size="10" font-weight="600" fill="currentColor">JR Hakodate Main</text>

    <circle cx="180" cy="558" r="6" fill="#009944" />
    <text x="194" y="561" font-size="10" font-weight="600" fill="currentColor">Namboku Subway</text>

    <circle cx="310" cy="558" r="6" fill="#0072BC" />
    <text x="324" y="561" font-size="10" font-weight="600" fill="currentColor">Toho Subway</text>

    <circle cx="430" cy="558" r="6" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="1.5" />
    <text x="444" y="561" font-size="10" font-weight="600" fill="currentColor">Chi-Ka-Ho Passage</text>
  </g>
</svg>
