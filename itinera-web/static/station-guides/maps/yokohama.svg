<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!--
    ========================================================================
    YOKOHAMA STATION SCHEMATIC MAP
    Minimalist 2D transit map design
    Philosophy: Clean, flat UI, high-contrast, optimized for mobile reading
    ========================================================================
  -->
  <defs>
    <!-- Crisp drop shadow for UI elements -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1c1917" flood-opacity="0.12" filter-units="userSpaceOnUse" />
    </filter>
  </defs>

  <!-- Layer 1: Background (transparent for dark/light mode compatibility) -->
  <g id="background">
    <rect width="800" height="600" fill="transparent" />
  </g>

  <!-- Layer 2: Connecting Conways & Pedestrian Paths -->
  <g id="connecting-paths">
    <!-- Main Central Passage (Connecting East and West exits) -->
    <rect x="180" y="240" width="440" height="80" rx="10" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.95" />

    <!-- Connecting passage to Keikyu Line (Northeast side) -->
    <rect x="420" y="160" width="80" height="90" rx="8" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.9" />

    <!-- Escalator Shaft down to Underground B1F Blue Line Subway -->
    <line x1="320" y1="310" x2="320" y2="390" stroke="#e8dcc0" stroke-width="14" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Layer 3: Operator Zones & Platforms -->
  <!-- 1. JR East Tokaido Line (Platforms 3-4) -->
  <g id="line-tokaido">
    <rect x="230" y="120" width="160" height="24" rx="12" fill="#FFD400" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="310" y="136" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#2d2d2d" text-anchor="middle" letter-spacing="0.3">TOKAIDO LINE (P3-4)</text>
  </g>

  <!-- 2. JR East Yokosuka Line (Platforms 7-10) -->
  <g id="line-yokosuka">
    <rect x="210" y="180" width="200" height="26" rx="13" fill="#008000" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="310" y="196" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">YOKOSUKA LINE (P7-10)</text>
  </g>

  <!-- 3. Keikyu Main Line (Platforms 1-2) -->
  <g id="line-keikyu">
    <rect x="440" y="110" width="150" height="24" rx="12" fill="#CC0000" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="515" y="125" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">KEIKYU LINE (P1-2)</text>
  </g>

  <!-- 4. Yokohama Subway Blue Line (B1F) -->
  <g id="line-subway">
    <rect x="210" y="394" width="220" height="26" rx="13" fill="#0096FF" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="320" y="410" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">BLUE LINE SUBWAY (B1F)</text>
  </g>

  <!-- Layer 4: Exit Pins -->
  <g id="exits">
    <!-- West Exit (Nishi-guchi) -->
    <g id="exit-west" filter="url(#shadow)">
      <circle cx="120" cy="280" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="120" y="287" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">W</text>
    </g>

    <!-- East Exit (Higashi-guchi) -->
    <g id="exit-east" filter="url(#shadow)">
      <circle cx="680" cy="280" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="680" y="287" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
    </g>
  </g>

  <!-- Layer 5: Labels & Warnings -->
  <g id="labels" font-family="Inter, system-ui, -apple-system, sans-serif">
    <!-- Title -->
    <text x="40" y="48" font-size="22" font-weight="800" fill="currentColor" letter-spacing="-0.5">Yokohama Station</text>
    <text x="40" y="68" font-size="11" font-weight="600" fill="currentColor" opacity="0.6" letter-spacing="1.2">SCHEMATIC MAP • B1F TO 1F (MEGA-LABYRINTH)</text>

    <!-- Orientations -->
    <text x="120" y="240" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">WEST EXIT (YODOBASHI / CHINATOWN BUS)</text>
    <text x="680" y="240" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">EAST EXIT (MINATO MIRAI / LANDMARK TOWER)</text>

    <!-- Navigation Helper Card -->
    <g id="navigation-card">
      <rect x="230" y="460" width="340" height="46" rx="8" fill="#EFF6FF" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)" />
      <text x="242" y="478" font-size="9" font-weight="700" fill="#1E40AF">🧭 KAMAKURA &amp; SIGHTSEEING ADVICE</text>
      <text x="242" y="489" font-size="8" font-weight="600" fill="#2563EB">To go to Kamakura, use JR Yokosuka Line (Green) from Platform 7-10.</text>
      <text x="242" y="498" font-size="8" font-weight="600" fill="#2563EB">To explore Minato Mirai (Port area), walk through the East Exit (10 min).</text>
    </g>
  </g>

  <!-- Layer 6: Legend -->
  <g id="legend" font-family="Inter, system-ui, -apple-system, sans-serif">
    <text x="40" y="540" font-size="11" font-weight="700" fill="currentColor" letter-spacing="0.8">LEGEND</text>

    <circle cx="48" cy="558" r="6" fill="#FFD400" />
    <text x="62" y="561" font-size="10" font-weight="600" fill="currentColor">JR Tokaido Line</text>

    <circle cx="170" cy="558" r="6" fill="#008000" />
    <text x="184" y="561" font-size="10" font-weight="600" fill="currentColor">JR Yokosuka Line</text>

    <circle cx="310" cy="558" r="6" fill="#CC0000" />
    <text x="324" y="561" font-size="10" font-weight="600" fill="currentColor">Keikyu Line</text>

    <circle cx="420" cy="558" r="6" fill="#0096FF" />
    <text x="434" y="561" font-size="10" font-weight="600" fill="currentColor">Municipal Subway</text>

    <circle cx="560" cy="558" r="6" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="1.5" />
    <text x="574" y="561" font-size="10" font-weight="600" fill="currentColor">Central Concourse</text>
  </g>
</svg>
