<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!--
    ========================================================================
    OSAKA (UMEDA) STATION SCHEMATIC MAP
    Minimalist 2D transit map design
    Philosophy: Clean, flat UI, high-contrast, optimized for mobile reading
    ========================================================================
  -->
  <defs>
    <!-- Crisp drop shadow for UI elements -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1c1917" flood-opacity="0.12" filter-units="userSpaceOnUse" />
    </filter>
  </defs>

  <!-- Layer 1: Background (transparent for dark/light mode compatibility) -->
  <g id="background">
    <rect width="800" height="600" fill="transparent" />
  </g>

  <!-- Layer 2: Connecting Corridors & Underground Malls (The 'Umeda Dungeon' B1F) -->
  <g id="connecting-paths">
    <!-- Diamor Osaka Concourse (South B1F) -->
    <rect x="230" y="280" width="160" height="100" rx="10" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.9" />

    <!-- Whity Umeda Concourse (East B1F) -->
    <rect x="380" y="260" width="150" height="120" rx="10" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.9" />

    <!-- JR-Hankyu Elevated Link Walkway (1F/2F) -->
    <rect x="420" y="140" width="90" height="130" rx="8" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.95" />

    <!-- Hanshin-JR Underground Link -->
    <line x1="330" y1="260" x2="330" y2="400" stroke="#e8dcc0" stroke-width="16" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Layer 3: Operator Zones & Platforms -->
  <!-- 1. JR West (Ground Level 1F) -->
  <!-- JR Kyoto/Kobe Line (Blue - Platforms 3-6) -->
  <g id="line-jr-kyoto-kobe">
    <rect x="220" y="180" width="200" height="26" rx="13" fill="#0072BC" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="320" y="196" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">JR KYOTO / KOBE LINE</text>
  </g>

  <!-- JR Osaka Loop Line (Orange - Platforms 1-2) -->
  <g id="line-osaka-loop">
    <rect x="220" y="214" width="200" height="26" rx="13" fill="#EA5404" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="320" y="230" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">OSAKA LOOP LINE</text>
  </g>

  <!-- 2. Hankyu Railway (Elevated 3F Terminal) -->
  <!-- Hankyu lines (Maroon - Platforms 1-9) -->
  <g id="line-hankyu">
    <rect x="520" y="70" width="40" height="180" rx="20" fill="#800000" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
    <text x="544" y="160" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" transform="rotate(-90 544 160)" letter-spacing="0.5">HANKYU TERMINAL</text>
  </g>

  <!-- 3. Osaka Metro (Underground B2F) -->
  <!-- Midosuji Line (Red - Platform B2F) -->
  <g id="line-midosuji">
    <rect x="460" y="110" width="24" height="300" rx="12" fill="#E51937" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="474" y="260" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" transform="rotate(-90 474 260)">MIDOSUJI LINE (B2F)</text>
  </g>

  <!-- 4. Hanshin Electric Railway (Underground B1F) -->
  <!-- Hanshin Main Line (Blue - Platforms 1-4) -->
  <g id="line-hanshin">
    <rect x="220" y="394" width="200" height="26" rx="13" fill="#004499" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="320" y="410" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">HANSHIN MAIN LINE</text>
  </g>

  <!-- Layer 4: Exit Pins -->
  <g id="exits">
    <!-- Central Exit (JR Osaka / grand front side) -->
    <g id="exit-central" filter="url(#shadow)">
      <circle cx="320" cy="130" r="20" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="320" y="136" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">C</text>
    </g>

    <!-- Midosuji Exit (Metro & Hankyu Access) -->
    <g id="exit-midosuji" filter="url(#shadow)">
      <circle cx="500" cy="300" r="20" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="500" y="306" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">M</text>
    </g>

    <!-- South Gate (Hanshin / Kitashinchi Access) -->
    <g id="exit-south" filter="url(#shadow)">
      <circle cx="320" cy="460" r="20" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="320" y="466" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">S</text>
    </g>
  </g>

  <!-- Layer 5: Labels & Warnings -->
  <g id="labels" font-family="Inter, system-ui, -apple-system, sans-serif">
    <!-- Title -->
    <text x="40" y="48" font-size="22" font-weight="800" fill="currentColor" letter-spacing="-0.5">Osaka (Umeda) Station</text>
    <text x="40" y="68" font-size="11" font-weight="600" fill="currentColor" opacity="0.6" letter-spacing="1.2">SCHEMATIC MAP • B2F TO 3F (UMEDA DUNGEON)</text>

    <!-- Orientation / Exit Labels (Aligned dynamically over/under/beside exits) -->
    <text x="320" y="96" font-size="9" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">CENTRAL EXIT (GRAND FRONT / YODOBASHI)</text>
    <text x="500" y="340" font-size="9" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">MIDOSUJI EXIT (METRO / HANKYU)</text>
    <text x="320" y="500" font-size="9" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">SOUTH GATE (HANSHIN / KITASHINCHI)</text>

    <!-- Dungeon Warning Card -->
    <g id="dungeon-warning">
      <rect x="40" y="280" width="170" height="46" rx="8" fill="#FEE2E2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)" />
      <text x="52" y="298" font-size="9" font-weight="700" fill="#991B1B">⚠ UMEDA DUNGEON</text>
      <text x="52" y="309" font-size="8" font-weight="600" fill="#DC2626">Extremely complex underground.</text>
      <text x="52" y="318" font-size="8" font-weight="600" fill="#DC2626">Go up to 1F street level if lost!</text>
    </g>
  </g>

  <!-- Layer 6: Legend -->
  <g id="legend" font-family="Inter, system-ui, -apple-system, sans-serif">
    <text x="40" y="540" font-size="11" font-weight="700" fill="currentColor" letter-spacing="0.8">LEGEND</text>

    <circle cx="48" cy="558" r="6" fill="#0072BC" />
    <text x="62" y="561" font-size="10" font-weight="600" fill="currentColor">JR Kyoto/Kobe</text>

    <circle cx="180" cy="558" r="6" fill="#EA5404" />
    <text x="194" y="561" font-size="10" font-weight="600" fill="currentColor">JR Osaka Loop</text>

    <circle cx="310" cy="558" r="6" fill="#800000" />
    <text x="324" y="561" font-size="10" font-weight="600" fill="currentColor">Hankyu Railway</text>

    <circle cx="440" cy="558" r="6" fill="#E51937" />
    <text x="454" y="561" font-size="10" font-weight="600" fill="currentColor">Midosuji Metro</text>

    <circle cx="570" cy="558" r="6" fill="#004499" />
    <text x="584" y="561" font-size="10" font-weight="600" fill="currentColor">Hanshin Line</text>

    <circle cx="680" cy="558" r="6" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="1.5" />
    <text x="694" y="561" font-size="10" font-weight="600" fill="currentColor">Dungeon Passage</text>
  </g>
</svg>
