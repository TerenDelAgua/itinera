<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!--
    ========================================================================
    KUMAMOTO STATION SCHEMATIC MAP
    Minimalist 2D transit map design
    Philosophy: Clean, flat UI, high-contrast, optimized for mobile reading
    ========================================================================
  -->
  <defs>
    <!-- Crisp drop shadow for UI elements -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1c1917" flood-opacity="0.12" filter-units="userSpaceOnUse" />
    </filter>
  </defs>

  <!-- Layer 1: Background (transparent for dark/light mode compatibility) -->
  <g id="background">
    <rect width="800" height="600" fill="transparent" />
  </g>

  <!-- Layer 2: Connecting Conways & Pedestrian Paths -->
  <g id="connecting-paths">
    <!-- Main Central Corridor (Connecting East and West exits) -->
    <rect x="180" y="240" width="440" height="80" rx="10" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.95" />

    <!-- Connecting passage to the elevated Shinkansen Gates -->
    <rect x="360" y="160" width="80" height="90" rx="8" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.9" />

    <!-- Pedestrian link outside West exit to the Tram Stop -->
    <line x1="120" y1="300" x2="120" y2="360" stroke="#e8dcc0" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Layer 3: Operator Zones & Platforms -->
  <!-- 1. JR Kyushu - Kyushu Shinkansen (Elevated 2F - Red - Platforms 1-2) -->
  <g id="line-shinkansen">
    <rect x="250" y="120" width="300" height="26" rx="13" fill="#E60012" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="400" y="136" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">KYUSHU SHINKANSEN (P1-2)</text>
  </g>

  <!-- 2. JR Kyushu - Hohi Main Line (Ground 1F - Green - Platforms 3-4) -->
  <g id="line-hohi">
    <rect x="250" y="180" width="300" height="26" rx="13" fill="#008000" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="400" y="196" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">HOHI MAIN LINE (P3-4 - TO ASO/OITA)</text>
  </g>

  <!-- 3. Kumamoto City Tram Stop (Ground level outside West Exit - Route A) -->
  <g id="line-tram">
    <rect x="220" y="360" width="360" height="40" rx="8" fill="#E60012" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" opacity="0.9" />
    <text x="400" y="384" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">KUMAMOTO CITY TRAM STOP (WEST EXIT)</text>
  </g>
  
  <!-- Layer 4: Exit Pins -->
  <g id="exits">
    <!-- West Exit (Nishi-guchi - Main Tourist exit / Tram) -->
    <g id="exit-west" filter="url(#shadow)">
      <circle cx="120" cy="280" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="120" y="287" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">W</text>
    </g>

    <!-- East Exit (Higashi-guchi - Local shopping) -->
    <g id="exit-east" filter="url(#shadow)">
      <circle cx="680" cy="280" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="680" y="287" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
    </g>
  </g>

  <!-- Layer 5: Labels & Warnings -->
  <g id="labels" font-family="Inter, system-ui, -apple-system, sans-serif">
    <!-- Title -->
    <text x="40" y="48" font-size="22" font-weight="800" fill="currentColor" letter-spacing="-0.5">Kumamoto Station</text>
    <text x="40" y="68" font-size="11" font-weight="600" fill="currentColor" opacity="0.6" letter-spacing="1.2">SCHEMATIC MAP • GROUND &amp; ELEVATED LEVELS</text>

    <!-- Orientations -->
    <text x="120" y="240" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">WEST EXIT (CASTLE / TRAM STOP / KUMAMON)</text>
    <text x="680" y="240" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">EAST EXIT (SHOPPING STREETS)</text>

    <!-- Sightseeing Card -->
    <g id="sightseeing-card">
      <rect x="230" y="440" width="340" height="46" rx="8" fill="#F0FDF4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)" />
      <text x="242" y="458" font-size="9" font-weight="700" fill="#166534">🏯 KUMAMOTO CASTLE TRAVEL ADVICE</text>
      <text x="242" y="469" font-size="8" font-weight="600" fill="#15803d">Walk out the West Exit and take the City Tram Route A.</text>
      <text x="242" y="478" font-size="8" font-weight="600" fill="#15803d">Alight at Kumamotojo-mae stop to access the Castle (15 min).</text>
    </g>
  </g>

  <!-- Layer 6: Legend -->
  <g id="legend" font-family="Inter, system-ui, -apple-system, sans-serif">
    <text x="40" y="540" font-size="11" font-weight="700" fill="currentColor" letter-spacing="0.8">LEGEND</text>

    <circle cx="48" cy="558" r="6" fill="#E60012" />
    <text x="62" y="561" font-size="10" font-weight="600" fill="currentColor">JR Kyushu (Kyushu Shinkansen / Tram)</text>

    <circle cx="280" cy="558" r="6" fill="#008000" />
    <text x="294" y="561" font-size="10" font-weight="600" fill="currentColor">JR Kyushu Hohi Main Line</text>

    <circle cx="480" cy="558" r="6" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="1.5" />
    <text x="494" y="561" font-size="10" font-weight="600" fill="currentColor">Central Concourse</text>
  </g>
</svg>
