<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!--
    ========================================================================
    KYOTO STATION SCHEMATIC MAP
    Minimalist 2D transit map design
    Philosophy: Clean, flat UI, high-contrast, optimized for mobile reading
    ========================================================================
  -->
  <defs>
    <!-- Crisp drop shadow for UI elements -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1c1917" flood-opacity="0.12" filter-units="userSpaceOnUse" />
    </filter>

    <!-- Gradient for Sagano Line long walk -->
    <linearGradient id="sagano-walk-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93278F" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f5ebd6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#93278F" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Layer 1: Background (transparent for dark/light mode compatibility) -->
  <g id="background">
    <rect width="800" height="600" fill="transparent" />
  </g>

  <!-- Layer 2: Connecting Corridors & Halls (soft beige tunnels) -->
  <g id="connecting-paths">
    <!-- North-South Pedestrian Free Passage (南北自由通路 - 2F) -->
    <rect x="350" y="150" width="80" height="300" rx="10" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.95" />

    <!-- Main Central Concourse (1F) -->
    <rect x="180" y="240" width="460" height="70" rx="10" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.95" />

    <!-- Long Pedestrian Corridor to Sagano Line (Dashed walk to the west) -->
    <path d="M 200 275 L 80 275 L 80 190" fill="none" stroke="url(#sagano-walk-grad)" stroke-width="12" stroke-dasharray="6,4" stroke-linecap="round" />
  </g>

  <!-- Layer 3: Operator Zones & Platforms -->
  <!-- Tokaido Shinkansen (Blue - Platforms 11-14) -->
  <g id="line-shinkansen">
    <rect x="450" y="340" width="34" height="120" rx="17" fill="#0055A5" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
    <line x1="440" y1="310" x2="440" y2="470" stroke="#0055A5" stroke-width="3" opacity="0.5" stroke-linecap="round" />
    <text x="467" y="395" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" transform="rotate(-90 467 395)">SHINKANSEN</text>
    <text x="467" y="358" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">P11-14</text>
  </g>

  <!-- JR Kyoto Line (Light Blue - Platforms 4-5) -->
  <g id="line-kyoto">
    <rect x="460" y="160" width="24" height="110" rx="12" fill="#0072BC" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
    <line x1="494" y1="130" x2="494" y2="280" stroke="#0072BC" stroke-width="3" opacity="0.5" stroke-linecap="round" />
    <text x="472" y="215" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" transform="rotate(-90 472 215)">JR KYOTO</text>
    <text x="472" y="176" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">P4/5</text>
  </g>

  <!-- Nara Line (Green/Yellow - Platforms 8-10) -->
  <g id="line-nara">
    <rect x="520" y="300" width="24" height="120" rx="12" fill="#8CBB26" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
    <line x1="554" y1="280" x2="554" y2="440" stroke="#8CBB26" stroke-width="3" opacity="0.5" stroke-linecap="round" />
    <text x="532" y="360" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" transform="rotate(-90 532 360)">NARA LINE</text>
    <text x="532" y="316" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">P8-10</text>
  </g>

  <!-- Kintetsu Kyoto Line (Orange - Platforms 1-4) -->
  <g id="line-kintetsu">
    <rect x="250" y="330" width="30" height="110" rx="15" fill="#F39200" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
    <line x1="240" y1="300" x2="240" y2="455" stroke="#F39200" stroke-width="3" opacity="0.5" stroke-linecap="round" />
    <text x="265" y="385" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" transform="rotate(-90 265 385)">KINTETSU</text>
  </g>

  <!-- Sagano Line Platform (Purple - Platforms 31-34) - FAR WEST -->
  <g id="line-sagano">
    <rect x="68" y="110" width="24" height="110" rx="12" fill="#93278F" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
    <line x1="58" y1="80" x2="58" y2="230" stroke="#93278F" stroke-width="3" opacity="0.5" stroke-linecap="round" />
    <text x="80" y="165" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" transform="rotate(-90 80 165)">SAGANO</text>
    <text x="80" y="126" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="7" font-weight="800" fill="#ffffff" text-anchor="middle">P31-34</text>
  </g>

  <!-- Kyoto Municipal Subway (Green - Karasuma Line - B1F) -->
  <g id="line-subway">
    <rect x="230" y="70" width="340" height="24" rx="12" fill="#009944" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="400" y="86" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">KYOTO MUNICIPAL SUBWAY (KARASUMA LINE B1F)</text>
  </g>

  <!-- Layer 4: Exit Pins -->
  <g id="exits">
    <!-- Karasuma Central Exit (North - Karasuma-guchi) -->
    <g id="exit-north" filter="url(#shadow)">
      <circle cx="390" cy="140" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="390" y="147" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">N</text>
    </g>

    <!-- Hachijo Exit (South - Hachijo-guchi) -->
    <g id="exit-south" filter="url(#shadow)">
      <circle cx="390" cy="460" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="390" y="467" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">S</text>
    </g>
  </g>

  <!-- Layer 5: Labels & Warnings -->
  <g id="labels" font-family="Inter, system-ui, -apple-system, sans-serif">
    <!-- Title -->
    <text x="40" y="48" font-size="22" font-weight="800" fill="currentColor" letter-spacing="-0.5">Kyoto Station</text>
    <text x="40" y="68" font-size="11" font-weight="600" fill="currentColor" opacity="0.6" letter-spacing="1.2">SCHEMATIC MAP • B1F / 1F / 2F</text>

    <!-- Orientations (Symmetrically aligned above and below their respective exit pins) -->
    <text x="390" y="102" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">NORTH (KYOTO TOWER / BUS TERMINAL)</text>
    <text x="390" y="510" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">SOUTH (HACHIJO-GUCHI / SHINKANSEN)</text>

    <!-- Pedestrian Passage text -->
    <text x="390" y="334" font-size="8" font-weight="700" fill="currentColor" opacity="0.5" text-anchor="middle" transform="rotate(-90 390 334)">NORTH-SOUTH FREE PASSAGE (2F)</text>

    <!-- Warning Card: Sagano Line walk distance -->
    <g id="sagano-warning">
      <rect x="40" y="215" width="200" height="36" rx="8" fill="#FEE2E2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)" />
      <text x="52" y="234" font-size="9" font-weight="700" fill="#991B1B">⚠ SAGANO LINE (P31-34)</text>
      <text x="52" y="245" font-size="8" font-weight="600" fill="#DC2626">Extremely far walk (5-8 min west)</text>
    </g>
  </g>

  <!-- Layer 6: Legend -->
  <g id="legend" font-family="Inter, system-ui, -apple-system, sans-serif">
    <text x="40" y="540" font-size="11" font-weight="700" fill="currentColor" letter-spacing="0.8">LEGEND</text>

    <circle cx="48" cy="558" r="6" fill="#0055A5" />
    <text x="62" y="561" font-size="10" font-weight="600" fill="currentColor">Tokaido Shinkansen</text>

    <circle cx="190" cy="558" r="6" fill="#0072BC" />
    <text x="204" y="561" font-size="10" font-weight="600" fill="currentColor">JR Kyoto Line</text>

    <circle cx="310" cy="558" r="6" fill="#93278F" />
    <text x="324" y="561" font-size="10" font-weight="600" fill="currentColor">Sagano Line</text>

    <circle cx="420" cy="558" r="6" fill="#8CBB26" />
    <text x="434" y="561" font-size="10" font-weight="600" fill="currentColor">Nara Line</text>

    <circle cx="510" cy="558" r="6" fill="#F39200" />
    <text x="524" y="561" font-size="10" font-weight="600" fill="currentColor">Kintetsu Line</text>

    <circle cx="610" cy="558" r="6" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="1.5" />
    <text x="624" y="561" font-size="10" font-weight="600" fill="currentColor">Corridor</text>
  </g>
</svg>
