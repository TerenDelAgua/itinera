<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!--
    ========================================================================
    NAGASAKI STATION SCHEMATIC MAP
    Minimalist 2D transit map design
    Philosophy: Clean, flat UI, high-contrast, optimized for mobile reading
    ========================================================================
  -->
  <defs>
    <!-- Crisp drop shadow for UI elements -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1c1917" flood-opacity="0.12" filter-units="userSpaceOnUse" />
    </filter>
  </defs>

  <!-- Layer 1: Background (transparent for dark/light mode compatibility) -->
  <g id="background">
    <rect width="800" height="600" fill="transparent" />
  </g>

  <!-- Layer 2: Connecting Concourse & Pedestrian Paths -->
  <g id="connecting-paths">
    <!-- Main Central Corridor (Connecting East and West exits) -->
    <rect x="180" y="240" width="440" height="80" rx="10" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.95" />

    <!-- Connecting passage to the elevated Shinkansen Gates -->
    <rect x="360" y="140" width="80" height="110" rx="8" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.9" />

    <!-- Pedestrian path outside West Exit to the Tram Stop -->
    <line x1="120" y1="300" x2="120" y2="360" stroke="#e8dcc0" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Layer 3: Operator Zones & Platforms -->
  <!-- 1. JR Kyushu - Nishi Kyushu Shinkansen (Red - Platforms 1-2) -->
  <g id="line-shinkansen">
    <rect x="250" y="100" width="300" height="26" rx="13" fill="#E60012" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="400" y="116" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">NISHI KYUSHU SHINKANSEN (P1-2 - TO HAKATA)</text>
  </g>

  <!-- 2. Nagasaki Electric Tramway (Green - Trams Platforms 1-3) -->
  <g id="line-tram">
    <rect x="220" y="360" width="360" height="40" rx="8" fill="#008000" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" opacity="0.9" />
    <text x="400" y="384" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">NAGASAKI ELECTRIC TRAMWAY STOP (WEST EXIT)</text>
  </g>

  <!-- Layer 4: Exit Pins -->
  <g id="exits">
    <!-- West Exit (Nishi-guchi - Main Tourist Exit / Trams & Harbor) -->
    <g id="exit-west" filter="url(#shadow)">
      <circle cx="120" cy="280" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="120" y="287" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">W</text>
    </g>

    <!-- East Exit (Higashi-guchi - Local Buses & High-speed Bus Terminal) -->
    <g id="exit-east" filter="url(#shadow)">
      <circle cx="680" cy="280" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="680" y="287" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
    </g>
  </g>

  <!-- Layer 5: Labels & Warnings -->
  <g id="labels" font-family="Inter, system-ui, -apple-system, sans-serif">
    <!-- Title -->
    <text x="40" y="48" font-size="22" font-weight="800" fill="currentColor" letter-spacing="-0.5">Nagasaki Station</text>
    <text x="40" y="68" font-size="11" font-weight="600" fill="currentColor" opacity="0.6" letter-spacing="1.2">SCHEMATIC MAP • MAIN &amp; SHINKANSEN LEVELS</text>

    <!-- Orientations -->
    <text x="120" y="240" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">WEST EXIT (TRAM STOP / HARBOR / TOURIST)</text>
    <text x="680" y="240" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">EAST EXIT (HIGH-SPEED BUS TERMINAL)</text>

    <!-- Sightseeing Card -->
    <g id="sightseeing-card">
      <rect x="200" y="430" width="400" height="66" rx="8" fill="#F0FDF4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)" />
      <text x="215" y="450" font-size="10" font-weight="700" fill="#166534">🚋 TRAMS &amp; SIGHTSEEING ADVICE</text>
      <text x="215" y="466" font-size="9" font-weight="600" fill="#15803d">Walk out the West Exit and board the Tram (Line 1 or 3) to reach Peace Park.</text>
      <text x="215" y="478" font-size="9" font-weight="600" fill="#15803d">Tip: Nagasaki is very hilly; the Electric Tramway is the best and cheapest transit.</text>
    </g>
  </g>

  <!-- Layer 6: Legend -->
  <g id="legend" font-family="Inter, system-ui, -apple-system, sans-serif">
    <text x="40" y="530" font-size="11" font-weight="700" fill="currentColor" letter-spacing="0.8">LEGEND</text>

    <circle cx="48" cy="548" r="6" fill="#E60012" />
    <text x="62" y="551" font-size="10" font-weight="600" fill="currentColor">JR Kyushu Nishi Kyushu Shinkansen</text>

    <circle cx="280" cy="548" r="6" fill="#008000" />
    <text x="294" y="551" font-size="10" font-weight="600" fill="currentColor">Nagasaki Electric Tramway Stop</text>

    <circle cx="480" cy="548" r="6" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="1.5" />
    <text x="494" y="551" font-size="10" font-weight="600" fill="currentColor">Central Concourse</text>
  </g>
</svg>
