<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!--
    ========================================================================
    KANAZAWA STATION SCHEMATIC MAP
    Minimalist 2D transit map design
    Philosophy: Clean, flat UI, high-contrast, optimized for mobile reading
    ========================================================================
  -->
  <defs>
    <!-- Crisp drop shadow for UI elements -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1c1917" flood-opacity="0.12" filter-units="userSpaceOnUse" />
    </filter>
  </defs>

  <!-- Layer 1: Background (transparent for dark/light mode compatibility) -->
  <g id="background">
    <rect width="800" height="600" fill="transparent" />
  </g>

  <!-- Layer 2: Connecting Concourse & Pedestrian Paths -->
  <g id="connecting-paths">
    <!-- Main Central Corridor (Connecting East and West exits) -->
    <rect x="180" y="240" width="440" height="80" rx="10" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.95" />

    <!-- Connecting passage to the elevated Shinkansen Gates -->
    <rect x="360" y="140" width="80" height="110" rx="8" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.9" />

    <!-- Motenashi Glass Dome (East Exit Plaza area) -->
    <circle cx="700" cy="280" r="45" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />
  </g>

  <!-- Layer 3: Operator Zones & Platforms -->
  <!-- 1. JR West - Hokuriku Shinkansen (Elevated 2F - Blue - Platforms 11-14) -->
  <g id="line-shinkansen">
    <rect x="250" y="100" width="300" height="26" rx="13" fill="#0055A5" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="400" y="116" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">HOKURIKU SHINKANSEN (P11-14 - TO TOKYO/TOYAMA)</text>
  </g>

  <!-- Layer 4: Exit Pins -->
  <g id="exits">
    <!-- West Exit (Nishi-guchi - Local shopping & hotels) -->
    <g id="exit-west" filter="url(#shadow)">
      <circle cx="120" cy="280" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="120" y="287" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">W</text>
    </g>

    <!-- East Exit (Higashi-guchi - Main Tourist Exit for Tsuzumi Gate & Kenrokuen) -->
    <g id="exit-east" filter="url(#shadow)">
      <circle cx="680" cy="280" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="680" y="287" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
    </g>
  </g>

  <!-- Layer 5: Labels & Landmarks -->
  <g id="labels" font-family="Inter, system-ui, -apple-system, sans-serif">
    <!-- Title -->
    <text x="40" y="48" font-size="22" font-weight="800" fill="currentColor" letter-spacing="-0.5">Kanazawa Station</text>
    <text x="40" y="68" font-size="11" font-weight="600" fill="currentColor" opacity="0.6" letter-spacing="1.2">SCHEMATIC MAP • MAIN &amp; SHINKANSEN LEVELS</text>

    <!-- Orientations -->
    <text x="120" y="240" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">WEST EXIT (LOCAL SHOPS &amp; HOTELS)</text>
    <text x="680" y="240" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">EAST EXIT (TSUZUMI DRUM GATE / BUSES)</text>

    <!-- Landmark callout for Tsuzumi Gate -->
    <text x="700" y="345" font-size="9" font-weight="800" fill="#0369a1" text-anchor="middle">⛩️ TSUZUMI GATE</text>
    <text x="700" y="357" font-size="8" font-weight="600" fill="#0284c7" text-anchor="middle">Motenashi Dome</text>

    <!-- Sightseeing Card -->
    <g id="sightseeing-card">
      <rect x="200" y="420" width="400" height="70" rx="8" fill="#FFFBEB" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)" />
      <text x="215" y="442" font-size="10" font-weight="700" fill="#92400e">🏯 KENROKUEN GARDEN &amp; SIGHTSEEING ADVICE</text>
      <text x="215" y="458" font-size="9" font-weight="600" fill="#b45309">Go out the East Exit to find the Kenrokuen Bus Terminal (Plaza center).</text>
      <text x="215" y="470" font-size="9" font-weight="600" fill="#b45309">Take the Kenrokuen Shuttle bus directly to the Garden (10 mins ride).</text>
      <text x="215" y="482" font-size="9" font-weight="600" fill="#b45309">Tip: Try the famous Gold Leaf Ice Cream sold right inside the East Exit gallery!</text>
    </g>
  </g>

  <!-- Layer 6: Legend -->
  <g id="legend" font-family="Inter, system-ui, -apple-system, sans-serif">
    <text x="40" y="530" font-size="11" font-weight="700" fill="currentColor" letter-spacing="0.8">LEGEND</text>

    <circle cx="48" cy="548" r="6" fill="#0055A5" />
    <text x="62" y="551" font-size="10" font-weight="600" fill="currentColor">JR West Hokuriku Shinkansen</text>

    <circle cx="280" cy="548" r="6" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="1.5" />
    <text x="294" y="551" font-size="10" font-weight="600" fill="currentColor">Central Concourse</text>

    <circle cx="450" cy="548" r="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="2 1" />
    <text x="464" y="551" font-size="10" font-weight="600" fill="currentColor">Motenashi Glass Dome Plaza</text>
  </g>
</svg>
