<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!--
    ========================================================================
    HAKODATE STATION SCHEMATIC MAP
    Minimalist 2D transit map design
    Philosophy: Clean, flat UI, high-contrast, optimized for mobile reading
    ========================================================================
  -->
  <defs>
    <!-- Crisp drop shadow for UI elements -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1c1917" flood-opacity="0.12" filter-units="userSpaceOnUse" />
    </filter>
  </defs>

  <!-- Layer 1: Background (transparent for dark/light mode compatibility) -->
  <g id="background">
    <rect width="800" height="600" fill="transparent" />
  </g>

  <!-- Layer 2: Connecting Concourse & Pedestrian Paths -->
  <g id="connecting-paths">
    <!-- Main Central Corridor (Connecting North and South exits) -->
    <rect x="180" y="240" width="440" height="80" rx="10" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.95" />

    <!-- Connecting passage to the JR Platforms Gates -->
    <rect x="360" y="140" width="80" height="110" rx="8" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.9" />

    <!-- Pedestrian path outside North exit to the Tram Stop & Morning Market -->
    <line x1="680" y1="300" x2="680" y2="360" stroke="#e8dcc0" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Layer 3: Operator Zones & Platforms -->
  <!-- 1. JR Hokkaido - Hakodate Main Line (Green - Platforms 1-3) -->
  <g id="line-hakodate">
    <rect x="250" y="100" width="300" height="26" rx="13" fill="#008000" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="400" y="116" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">JR HAKODATE MAIN LINE (P1-3 - TO SAPPORO)</text>
  </g>

  <!-- Layer 4: Exit Pins -->
  <g id="exits">
    <!-- South Exit (Minami-guchi - Taxi Stand) -->
    <g id="exit-south" filter="url(#shadow)">
      <circle cx="120" cy="280" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="120" y="287" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">S</text>
    </g>

    <!-- North Exit (Kita-guchi - Main Tourist Exit / Trams, Market, Bay) -->
    <g id="exit-north" filter="url(#shadow)">
      <circle cx="680" cy="280" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="680" y="287" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">N</text>
    </g>
  </g>

  <!-- Layer 5: Labels & Warnings -->
  <g id="labels" font-family="Inter, system-ui, -apple-system, sans-serif">
    <!-- Title -->
    <text x="40" y="48" font-size="22" font-weight="800" fill="currentColor" letter-spacing="-0.5">Hakodate Station</text>
    <text x="40" y="68" font-size="11" font-weight="600" fill="currentColor" opacity="0.6" letter-spacing="1.2">SCHEMATIC MAP • MAIN &amp; PLATFORM LEVELS</text>

    <!-- Orientations -->
    <text x="120" y="240" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">SOUTH EXIT (TAXIS)</text>
    <text x="680" y="240" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">NORTH EXIT (TRAMS / MORNING MARKET / BAY AREA)</text>

    <!-- Sightseeing Card -->
    <g id="sightseeing-card">
      <rect x="200" y="420" width="400" height="70" rx="8" fill="#F0FDFA" stroke="#0d9488" stroke-width="1.5" filter="url(#shadow)" />
      <text x="215" y="442" font-size="10" font-weight="700" fill="#115e59">🦑 MORNING MARKET &amp; SIGHTSEEING ADVICE</text>
      <text x="215" y="458" font-size="9" font-weight="600" fill="#0f766e">Walk out the North Exit and head East for 5 mins to reach the Morning Market.</text>
      <text x="215" y="470" font-size="9" font-weight="600" fill="#0f766e">Tram stop is right outside the North Exit. Board Line 2 or 5 for Motomachi / Bay.</text>
      <text x="215" y="482" font-size="9" font-weight="600" fill="#0f766e">Food tip: Try the famous 'Ganso Yaki' (fresh grilled squid) at the market stands!</text>
    </g>
  </g>

  <!-- Layer 6: Legend -->
  <g id="legend" font-family="Inter, system-ui, -apple-system, sans-serif">
    <text x="40" y="530" font-size="11" font-weight="700" fill="currentColor" letter-spacing="0.8">LEGEND</text>

    <circle cx="48" cy="548" r="6" fill="#008000" />
    <text x="62" y="551" font-size="10" font-weight="600" fill="currentColor">JR Hokkaido Hakodate Main Line</text>

    <circle cx="280" cy="548" r="6" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="1.5" />
    <text x="294" y="551" font-size="10" font-weight="600" fill="currentColor">Central Concourse</text>
  </g>
</svg>
