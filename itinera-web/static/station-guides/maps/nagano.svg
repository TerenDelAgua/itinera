<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!--
    ========================================================================
    NAGANO STATION SCHEMATIC MAP
    Minimalist 2D transit map design
    Philosophy: Clean, flat UI, high-contrast, optimized for mobile reading
    ========================================================================
  -->
  <defs>
    <!-- Crisp drop shadow for UI elements -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1c1917" flood-opacity="0.12" filter-units="userSpaceOnUse" />
    </filter>
  </defs>

  <!-- Layer 1: Background (transparent for dark/light mode compatibility) -->
  <g id="background">
    <rect width="800" height="600" fill="transparent" />
  </g>

  <!-- Layer 2: Connecting Conways & Pedestrian Paths -->
  <g id="connecting-paths">
    <!-- Main Central Passageway connecting East & West Exits -->
    <rect x="180" y="240" width="440" height="80" rx="10" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.95" />

    <!-- Connecting passage between JR Shinkansen Gates and Shinano Railway -->
    <rect x="360" y="160" width="80" height="100" rx="8" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.9" />
  </g>

  <!-- Layer 3: Operator Zones & Platforms -->
  <!-- 1. JR Hokuriku Shinkansen (Platforms 11-14) -->
  <g id="line-shinkansen">
    <rect x="250" y="130" width="300" height="26" rx="13" fill="#0055A5" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="400" y="146" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">HOKURIKU SHINKANSEN (P11-14)</text>
  </g>

  <!-- 2. Shinano Railway (Platforms 5-6) -->
  <g id="line-shinano">
    <rect x="250" y="380" width="300" height="26" rx="13" fill="#FFD400" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="400" y="396" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#2d2d2d" text-anchor="middle" letter-spacing="0.3">SHINANO RAILWAY (P5-6)</text>
  </g>

  <!-- Layer 4: Exit Pins -->
  <g id="exits">
    <!-- West Exit (Nishi-guchi) -->
    <g id="exit-west" filter="url(#shadow)">
      <circle cx="120" cy="280" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="120" y="287" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">W</text>
    </g>

    <!-- East Exit (Higashi-guchi) -->
    <g id="exit-east" filter="url(#shadow)">
      <circle cx="680" cy="280" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="680" y="287" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
    </g>
  </g>

  <!-- Layer 5: Labels & Warnings -->
  <g id="labels" font-family="Inter, system-ui, -apple-system, sans-serif">
    <!-- Title -->
    <text x="40" y="48" font-size="22" font-weight="800" fill="currentColor" letter-spacing="-0.5">Nagano Station</text>
    <text x="40" y="68" font-size="11" font-weight="600" fill="currentColor" opacity="0.6" letter-spacing="1.2">SCHEMATIC MAP • GROUND LEVEL (CHUBU REGION HUB)</text>

    <!-- Orientations -->
    <text x="120" y="240" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">WEST EXIT (CITY CENTER / HOTELS)</text>
    <text x="680" y="240" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">EAST EXIT (ZENKOJI TEMPLE / BUS TERMINAL)</text>

    <!-- Transfer Connection Card -->
    <g id="transfer-card">
      <rect x="230" y="450" width="340" height="46" rx="8" fill="#FFFBEB" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)" />
      <text x="242" y="468" font-size="9" font-weight="700" fill="#78350F">⚠️ PLATFORM TRANSFER WARNING</text>
      <text x="242" y="479" font-size="8" font-weight="600" fill="#92400E">Hokuriku Shinkansen and Shinano Railway are on different platforms!</text>
      <text x="242" y="488" font-size="8" font-weight="600" fill="#92400E">Allow at least 10 minutes walking and ticketing transfer time.</text>
    </g>
  </g>

  <!-- Layer 6: Legend -->
  <g id="legend" font-family="Inter, system-ui, -apple-system, sans-serif">
    <text x="40" y="540" font-size="11" font-weight="700" fill="currentColor" letter-spacing="0.8">LEGEND</text>

    <circle cx="48" cy="558" r="6" fill="#0055A5" />
    <text x="62" y="561" font-size="10" font-weight="600" fill="currentColor">JR East (Hokuriku Shinkansen)</text>

    <circle cx="280" cy="558" r="6" fill="#FFD400" />
    <text x="294" y="561" font-size="10" font-weight="600" fill="currentColor">Shinano Railway</text>

    <circle cx="450" cy="558" r="6" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="1.5" />
    <text x="464" y="561" font-size="10" font-weight="600" fill="currentColor">Central Concourse</text>
  </g>
</svg>
