<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!--
    ========================================================================
    TOBU NIKKO STATION SCHEMATIC MAP
    Minimalist 2D transit map design
    Philosophy: Clean, flat UI, high-contrast, optimized for mobile reading
    ========================================================================
  -->
  <defs>
    <!-- Crisp drop shadow for UI elements -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1c1917" flood-opacity="0.12" filter-units="userSpaceOnUse" />
    </filter>
  </defs>

  <!-- Layer 1: Background (transparent for dark/light mode compatibility) -->
  <g id="background">
    <rect width="800" height="600" fill="transparent" />
  </g>

  <!-- Layer 2: Connecting Concourse & Pedestrian Paths -->
  <g id="connecting-paths">
    <!-- Main Central Corridor (Connecting East and West exits) -->
    <rect x="180" y="240" width="440" height="80" rx="10" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.95" />

    <!-- Connecting passage to the Tobu Platforms Gates -->
    <rect x="360" y="140" width="80" height="110" rx="8" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.9" />

    <!-- World Heritage Bus Terminal (Outside East Exit) -->
    <rect x="630" y="340" width="120" height="40" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
    <text x="690" y="364" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#ef4444" text-anchor="middle">⛩️ HERITAGE BUS STOP</text>
  </g>

  <!-- Layer 3: Operator Zones & Platforms -->
  <!-- 1. Tobu Railway - Tobu Nikko Line (Red - Platforms 1-2) -->
  <g id="line-tobu">
    <rect x="250" y="100" width="300" height="26" rx="13" fill="#CC0000" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="400" y="116" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">TOBU NIKKO LINE (P1-2 - TO TOKYO / ASAKUSA)</text>
  </g>

  <!-- Layer 4: Exit Pins -->
  <g id="exits">
    <!-- West Exit (Nishi-guchi - Local shops & quiet area) -->
    <g id="exit-west" filter="url(#shadow)">
      <circle cx="120" cy="280" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="120" y="287" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">W</text>
    </g>

    <!-- East Exit (Higashi-guchi - Main Sightseeing / Shrines & World Heritage Bus) -->
    <g id="exit-east" filter="url(#shadow)">
      <circle cx="680" cy="280" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="680" y="287" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
    </g>
  </g>

  <!-- Layer 5: Labels & Warnings -->
  <g id="labels" font-family="Inter, system-ui, -apple-system, sans-serif">
    <!-- Title -->
    <text x="40" y="48" font-size="22" font-weight="800" fill="currentColor" letter-spacing="-0.5">Tobu Nikko Station</text>
    <text x="40" y="68" font-size="11" font-weight="600" fill="currentColor" opacity="0.6" letter-spacing="1.2">SCHEMATIC MAP • TOURIST GATEWAY TO NIKKO</text>

    <!-- Orientations -->
    <text x="120" y="240" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">WEST EXIT (LOCAL AREA)</text>
    <text x="680" y="240" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">EAST EXIT (SHRINES / TOBUSHOP / BUSES)</text>

    <!-- Sightseeing Card -->
    <g id="sightseeing-card">
      <rect x="200" y="420" width="400" height="70" rx="8" fill="#FFF5F5" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)" />
      <text x="215" y="442" font-size="10" font-weight="700" fill="#991b1b">⛩️ WORLD HERITAGE SHRINES SIGHTSEEING ADVICE</text>
      <text x="215" y="458" font-size="9" font-weight="600" fill="#b91c1c">Go out the East Exit for the World Heritage Bus Stop (direct to shrines).</text>
      <text x="215" y="470" font-size="9" font-weight="600" fill="#b91c1c">Buying a bus day-pass at the station ticket hall is highly recommended.</text>
      <text x="215" y="482" font-size="9" font-weight="600" fill="#b91c1c">Tip: Tobu Nikko is significantly closer to Toshogu Shrine than JR Nikko Station.</text>
    </g>
  </g>

  <!-- Layer 6: Legend -->
  <g id="legend" font-family="Inter, system-ui, -apple-system, sans-serif">
    <text x="40" y="530" font-size="11" font-weight="700" fill="currentColor" letter-spacing="0.8">LEGEND</text>

    <circle cx="48" cy="548" r="6" fill="#CC0000" />
    <text x="62" y="551" font-size="10" font-weight="600" fill="currentColor">Tobu Railway Nikko Line</text>

    <circle cx="280" cy="548" r="6" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="1.5" />
    <text x="294" y="551" font-size="10" font-weight="600" fill="currentColor">Central Concourse</text>
  </g>
</svg>
