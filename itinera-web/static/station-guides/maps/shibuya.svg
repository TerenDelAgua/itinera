<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!--
    ========================================================================
    SHIBUYA STATION SCHEMATIC MAP
    Minimalist 2D transit map design
    Philosophy: Clean, flat UI, high-contrast, optimized for mobile reading
    ========================================================================
  -->
  <defs>
    <!-- Crisp drop shadow for UI elements -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1c1917" flood-opacity="0.12" filter-units="userSpaceOnUse" />
    </filter>

    <!-- Gradient for deep vertical transfer escalators -->
    <linearGradient id="deep-climb-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B9AD8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f5ebd6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1b1917" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Layer 1: Background (transparent for dark/light mode compatibility) -->
  <g id="background">
    <rect width="800" height="600" fill="transparent" />
  </g>

  <!-- Layer 2: Connecting Corridors & Halls (soft beige tunnels) -->
  <g id="connecting-paths">
    <!-- Main Ground Concourse (1F) -->
    <rect x="200" y="210" width="380" height="80" rx="10" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.95" />

    <!-- Underground Hanzomon Passage (B3F Concourse) -->
    <rect x="180" y="320" width="300" height="50" rx="8" fill="#e8dcc0" stroke="#dcd0b4" stroke-width="1.5" opacity="0.9" />

    <!-- Deep Underground Escalator Shaft (Toyoko/Fukutoshin connection B5F -> 1F) -->
    <path d="M 280 430 L 280 270" fill="none" stroke="url(#deep-climb-grad)" stroke-width="14" stroke-dasharray="6,4" stroke-linecap="round" />
  </g>

  <!-- Layer 3: Operator Zones & Platforms -->
  <!-- 1. JR East (Ground Level 1F) -->
  <!-- JR Yamanote Line (Green - Platforms 1-2) -->
  <g id="line-yamanote">
    <rect x="330" y="150" width="24" height="200" rx="12" fill="#9ACD32" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
    <line x1="320" y1="120" x2="320" y2="370" stroke="#9ACD32" stroke-width="3" opacity="0.5" stroke-linecap="round" />
    <text x="342" y="200" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" transform="rotate(-90 342 200)">JR YAMANOTE</text>
    <text x="342" y="166" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">P1/2</text>
  </g>

  <!-- JR Saikyo Line (Teal - Platforms 3-4) -->
  <g id="line-saikyo">
    <rect x="390" y="150" width="24" height="200" rx="12" fill="#00AC9B" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
    <line x1="424" y1="120" x2="424" y2="370" stroke="#00AC9B" stroke-width="3" opacity="0.5" stroke-linecap="round" />
    <text x="402" y="200" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" transform="rotate(-90 402 200)">Saikyo Line</text>
    <text x="402" y="166" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">P3/4</text>
  </g>

  <!-- 2. Tokyo Metro Elevated (3F) -->
  <!-- Tokyo Metro Ginza Line (Orange - Platform 3F) -->
  <g id="line-ginza">
    <rect x="470" y="130" width="30" height="150" rx="15" fill="#FF9900" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
    <line x1="460" y1="100" x2="460" y2="300" stroke="#FF9900" stroke-width="3.5" opacity="0.5" stroke-linecap="round" />
    <text x="485" y="215" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" transform="rotate(-90 485 215)">GINZA LINE (3F)</text>
  </g>

  <!-- 3. Tokyo Metro Underground (B3F) -->
  <!-- Tokyo Metro Hanzomon Line (Brown - Platform B3F) -->
  <g id="line-hanzomon">
    <rect x="160" y="332" width="220" height="26" rx="13" fill="#8B4513" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="270" y="348" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">HANZOMON LINE (B3F)</text>
  </g>

  <!-- 4. Tokyu/Tokyo Metro Deep Underground (B5F) -->
  <!-- Toyoko & Fukutoshin Lines (Deep Blue/Brown - B5F Platform) -->
  <g id="line-deep-subway">
    <rect x="180" y="440" width="220" height="32" rx="16" fill="#1B9AD8" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />
    <text x="290" y="460" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">TOKYU TOYOKO / FUKUTOSHIN (B5F)</text>
  </g>

  <!-- Layer 4: Exit Pins -->
  <g id="exits">
    <!-- Hachiko Exit (West - Near Shibuya Crossing) -->
    <g id="exit-hachiko" filter="url(#shadow)">
      <circle cx="110" cy="250" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="110" y="257" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">H</text>
    </g>
  </g>

  <!-- Layer 5: Labels & Warnings -->
  <g id="labels" font-family="Inter, system-ui, -apple-system, sans-serif">
    <!-- Title -->
    <text x="40" y="48" font-size="22" font-weight="800" fill="currentColor" letter-spacing="-0.5">Shibuya Station</text>
    <text x="40" y="68" font-size="11" font-weight="600" fill="currentColor" opacity="0.6" letter-spacing="1.2">SCHEMATIC MAP • B5F TO 3F</text>

    <!-- Exit Label (Symmetrically aligned above Hachiko pin) -->
    <text x="110" y="210" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">HACHIKO EXIT (SHIBUYA CROSSING)</text>

    <!-- Deep Walk Escalator Label -->
    <text x="264" y="380" font-size="8" font-weight="700" fill="currentColor" opacity="0.5" text-anchor="middle" transform="rotate(-90 264 380)">DEEP TRANSFER SHAFT</text>

    <!-- Warning Card: Deep Toyoko/Fukutoshin lines -->
    <g id="deep-warning">
      <rect x="420" y="438" width="220" height="36" rx="8" fill="#FEE2E2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)" />
      <text x="432" y="457" font-size="9" font-weight="700" fill="#991B1B">⚠ DEEP TRANSFER (B5F)</text>
      <text x="432" y="468" font-size="8" font-weight="600" fill="#DC2626">Toyoko &amp; Fukutoshin are 10 min down</text>
    </g>
  </g>

  <!-- Layer 6: Legend -->
  <g id="legend" font-family="Inter, system-ui, -apple-system, sans-serif">
    <text x="40" y="540" font-size="11" font-weight="700" fill="currentColor" letter-spacing="0.8">LEGEND</text>

    <circle cx="48" cy="558" r="6" fill="#9ACD32" />
    <text x="62" y="561" font-size="10" font-weight="600" fill="currentColor">JR Yamanote Line</text>

    <circle cx="180" cy="558" r="6" fill="#FF9900" />
    <text x="194" y="561" font-size="10" font-weight="600" fill="currentColor">Ginza Line (3F)</text>

    <circle cx="300" cy="558" r="6" fill="#8B4513" />
    <text x="314" y="561" font-size="10" font-weight="600" fill="currentColor">Hanzomon Line (B3F)</text>

    <circle cx="430" cy="558" r="6" fill="#1B9AD8" />
    <text x="444" y="561" font-size="10" font-weight="600" fill="currentColor">Toyoko/Fukutoshin (B5F)</text>

    <circle cx="580" cy="558" r="6" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="1.5" />
    <text x="594" y="561" font-size="10" font-weight="600" fill="currentColor">Passage</text>
  </g>
</svg>
