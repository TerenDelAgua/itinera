<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!--
    ========================================================================
    SENDAI STATION SCHEMATIC MAP
    Minimalist 2D transit map design
    Philosophy: Clean, flat UI, high-contrast, optimized for mobile reading
    ========================================================================
  -->
  <defs>
    <!-- Crisp drop shadow for UI elements -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1c1917" flood-opacity="0.12" filter-units="userSpaceOnUse" />
    </filter>
  </defs>

  <!-- Layer 1: Background (transparent for dark/light mode compatibility) -->
  <g id="background">
    <rect width="800" height="600" fill="transparent" />
  </g>

  <!-- Layer 2: Connecting Concourse & Pedestrian Paths -->
  <g id="connecting-paths">
    <!-- Main Central Corridor (Connecting East and West exits) -->
    <rect x="180" y="240" width="440" height="80" rx="10" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.95" />

    <!-- Connecting passage to the elevated Shinkansen Gates -->
    <rect x="360" y="140" width="80" height="110" rx="8" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="2" opacity="0.9" />

    <!-- Connecting path to the underground Subway (B1 Level) -->
    <rect x="375" y="320" width="50" height="70" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Layer 3: Operator Zones & Platforms -->
  <!-- 1. JR East - Tohoku Shinkansen (Elevated 2F - Blue - Platforms 11-14) -->
  <g id="line-shinkansen">
    <rect x="250" y="100" width="300" height="26" rx="13" fill="#0055A5" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="400" y="116" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">TOHOKU SHINKANSEN (P11-14 - TO TOKYO/MORIOKA)</text>
  </g>

  <!-- 2. JR East - Senseki Line (Ground 1F - Green - Platforms 5-6) -->
  <g id="line-senseki">
    <rect x="250" y="160" width="300" height="26" rx="13" fill="#008000" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="400" y="176" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">JR SENSEKI LINE (P5-6 - TO MATSUSHIMA)</text>
  </g>

  <!-- 3. Sendai Subway Namboku Line (Underground B1 - Subway Green - Platforms B1) -->
  <g id="line-subway">
    <rect x="250" y="390" width="300" height="26" rx="13" fill="#059669" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
    <text x="400" y="406" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">SENDAI SUBWAY NAMBOKU LINE (B1 - TO SUSUKINO)</text>
  </g>

  <!-- Layer 4: Exit Pins -->
  <g id="exits">
    <!-- West Exit (Nishi-guchi - Quiet local area / hotels) -->
    <g id="exit-west" filter="url(#shadow)">
      <circle cx="120" cy="280" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="120" y="287" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">W</text>
    </g>

    <!-- East Exit (Higashi-guchi - Main Tourist Exit / Castle, Zuihoden, Aoba-dori) -->
    <g id="exit-east" filter="url(#shadow)">
      <circle cx="680" cy="280" r="22" fill="#e25c3d" stroke="#ffffff" stroke-width="3" />
      <text x="680" y="287" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
    </g>
  </g>

  <!-- Layer 5: Labels & Warnings -->
  <g id="labels" font-family="Inter, system-ui, -apple-system, sans-serif">
    <!-- Title -->
    <text x="40" y="48" font-size="22" font-weight="800" fill="currentColor" letter-spacing="-0.5">Sendai Station</text>
    <text x="40" y="68" font-size="11" font-weight="600" fill="currentColor" opacity="0.6" letter-spacing="1.2">SCHEMATIC MAP • MULTI-LEVEL TRANSIT HUB</text>

    <!-- Orientations -->
    <text x="120" y="240" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">WEST EXIT (HOTELS / TAXI PLAZA)</text>
    <text x="680" y="240" font-size="10" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.5" text-anchor="middle">EAST EXIT (TO AOBA-DORI / SIGHTSEEING)</text>

    <!-- Sightseeing Card -->
    <g id="sightseeing-card">
      <rect x="200" y="440" width="400" height="70" rx="8" fill="#FFFDF5" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)" />
      <text x="215" y="462" font-size="10" font-weight="700" fill="#b45309">🍲 TOHOKU TRAVEL &amp; FOOD ADVICE</text>
      <text x="215" y="478" font-size="9" font-weight="600" fill="#d97706">Transfer to the JR Senseki Line (P5-6) for direct access to Matsushima Bay.</text>
      <text x="215" y="490" font-size="9" font-weight="600" fill="#d97706">Take the Loopple Sendai Bus from the East Exit to visit Aoba Castle Ruins.</text>
      <text x="215" y="502" font-size="9" font-weight="600" fill="#d97706">Food tip: Try local Gyutan (beef tongue) at Rikyu just inside the station gallery.</text>
    </g>
  </g>

  <!-- Layer 6: Legend -->
  <g id="legend" font-family="Inter, system-ui, -apple-system, sans-serif">
    <text x="40" y="530" font-size="11" font-weight="700" fill="currentColor" letter-spacing="0.8">LEGEND</text>

    <circle cx="48" cy="548" r="6" fill="#0055A5" />
    <text x="62" y="551" font-size="10" font-weight="600" fill="currentColor">JR East Tohoku Shinkansen</text>

    <circle cx="280" cy="548" r="6" fill="#008000" />
    <text x="294" y="551" font-size="10" font-weight="600" fill="currentColor">JR East Senseki Line (Matsushima)</text>

    <circle cx="510" cy="548" r="6" fill="#059669" />
    <text x="524" y="551" font-size="10" font-weight="600" fill="currentColor">Sendai Subway Namboku Line</text>

    <circle cx="48" cy="570" r="6" fill="#f5ebd6" stroke="#e8dcc0" stroke-width="1.5" />
    <text x="62" y="573" font-size="10" font-weight="600" fill="currentColor">Central Concourse</text>
  </g>
</svg>
