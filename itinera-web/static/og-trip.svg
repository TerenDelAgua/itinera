<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Fondo: Off-White (TEREN Light Mode Base) -->
  <rect width="1200" height="630" fill="#F5F4F1"/>
  
  <!-- Barra de acento superior -->
  <rect x="0" y="0" width="1200" height="12" fill="#FF8C42"/>

  <!-- Badge de contexto -->
  <rect x="100" y="100" width="160" height="40" rx="20" fill="#FFF7ED"/>
  <text x="120" y="126" text-anchor="start" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FF8C42" letter-spacing="1">ITINERA TRIP</text>

  <!-- Título del viaje (Placeholder genérico para F1) -->
  <text x="100" y="240" text-anchor="start" font-family="'Inter', sans-serif" font-size="72" font-weight="800" fill="#1C1917" letter-spacing="-1.5">
    Your Trip Itinerary
  </text>

  <!-- Subtítulo con valores clave -->
  <text x="100" y="310" text-anchor="start" font-family="'Inter', sans-serif" font-size="32" font-weight="500" fill="#57534E">
    Offline-ready • Budget tracking • Station guides
  </text>

  <!-- Mock UI Element (Tarjeta de día) -->
  <g transform="translate(100, 380)">
    <!-- Sombra sutil -->
    <rect x="4" y="4" width="980" height="160" rx="16" fill="#000000" opacity="0.04"/>
    <!-- Tarjeta -->
    <rect x="0" y="0" width="980" height="160" rx="16" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
    
    <!-- Contenido de la tarjeta -->
    <rect x="40" y="40" width="180" height="28" rx="14" fill="#FFF7ED"/>
    <text x="54" y="59" text-anchor="start" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FF8C42">Day 1 • Tokyo</text>

    <rect x="40" y="90" width="500" height="16" rx="8" fill="#F5F4F1"/>
    <rect x="40" y="116" width="350" height="16" rx="8" fill="#F5F4F1"/>
    
    <!-- Icono de check decorativo -->
    <circle cx="900" cy="80" r="24" fill="#22C55E" opacity="0.1"/>
    <text x="891" y="87" text-anchor="start" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#22C55E">✓</text>
  </g>

  <!-- Footer -->
  <text x="100" y="580" text-anchor="start" font-family="'Inter', sans-serif" font-size="18" font-weight="500" fill="#57534E" letter-spacing="1">
    goitinera.app
  </text>
</svg>